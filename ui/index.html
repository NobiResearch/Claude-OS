<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Claude OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-mark">◆</div>
    <div class="boot-name">Claude OS</div>
    <div class="boot-log"></div>
  </div>

  <header class="menubar">
    <button id="mb-logo" class="mb-item logo" title="Command palette (⌘K)">◆ <b>Claude OS</b></button>
    <span id="mb-app" class="mb-item app">Desktop</span>
    <span class="mb-spacer"></span>
    <button id="mb-update" class="mb-item update" hidden>↻ Update</button>
    <button id="mb-music" class="mb-item music" hidden></button>
    <button id="mb-signals" class="mb-item signals ok" title="All quiet"><span class="dot"></span></button>
    <span id="mb-disk" class="mb-item"></span>
    <span id="mb-batt" class="mb-item"></span>
    <span id="mb-clock" class="mb-item clock"></span>
  </header>

  <main id="desktop" class="desktop">
    <section id="today" class="today"></section>
    <div id="windows"></div>
  </main>

  <nav id="dock" class="dock" aria-label="Apps"></nav>

  <div id="palette" class="palette hidden">
    <div class="palette-box">
      <input id="palette-input" class="palette-input" placeholder="Ask Claude, or open an app…" autocomplete="off" spellcheck="false">
      <div id="palette-list" class="palette-list"></div>
      <div class="palette-hint">↵ to run · ↑↓ to choose · esc to close</div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="md.js"></script>
  <script src="os.js"></script>
  <script src="apps.js"></script>
</body>
</html>
